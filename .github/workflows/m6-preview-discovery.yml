name: M6 Preview discovery

on:
  push:
    branches: [codex/m6-memory-integration]
    paths:
      - '.github/workflows/m6-preview-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resolve latest successful branch preview
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: nagi-presence-poc
          TARGET_BRANCH: codex/m6-memory-integration
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?env=preview&per_page=50"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$api")"
          found="$(jq -c --arg branch "$TARGET_BRANCH" \
            '[.result[] | select(.deployment_trigger.metadata.branch == $branch and .latest_stage.status == "success")][0] // empty' \
            <<<"$response")"
          if [ -z "$found" ]; then
            echo 'M6_PREVIEW status=not_found' | tee preview.txt
            exit 0
          fi
          url="$(jq -r '.url // ""' <<<"$found")"
          sha="$(jq -r '.deployment_trigger.metadata.commit_hash // ""' <<<"$found")"
          short_id="$(jq -r '.short_id // ""' <<<"$found")"
          {
            echo "M6_PREVIEW status=success"
            echo "M6_PREVIEW_URL $url"
            echo "M6_PREVIEW_SHA $sha"
            echo "M6_PREVIEW_SHORT_ID $short_id"
          } | tee preview.txt
      - name: Upload preview discovery
        uses: actions/upload-artifact@v4
        with:
          name: m6-preview-discovery
          path: preview.txt
          if-no-files-found: error
