name: M6 Memory bridge tests

on:
  push:
    branches: [codex/m6-memory-integration]
    paths:
      - 'runtime/conversation-adapter.js'
      - 'test/memory-conversation-adapter.test.js'
      - '.github/workflows/m6-memory-bridge-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run memory conversation adapter tests
        run: node --test test/memory-conversation-adapter.test.js
