<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>Nagi Presence Client v1.1.0-multichannel</title>
<style>
:root{--bg:#f5f1e8;--ink:#2f3437;--muted:#747b80;--panel:rgba(255,255,255,.8);--line:rgba(47,52,55,.12);--ok:#345b46;--warn:#8a6428;--err:#9a3e36;--nagi:#e8e3d8;--hiro:#345b46}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#fffdf8 0,var(--bg) 48%,#ece6da 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;min-height:100svh;display:grid;place-items:center}.app{width:min(100%,860px);min-height:100svh;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:650;letter-spacing:.02em}.sub,.ver,.status,.hint,.continuity{font-size:12px;color:var(--muted)}.stage{display:grid;place-items:center;align-content:center;gap:14px;text-align:center}.portrait-wrap{position:relative;width:min(74vw,420px);aspect-ratio:1;border-radius:36px;overflow:hidden;background:#d7d1c5;box-shadow:0 22px 60px rgba(44,49,52,.12)}.portrait,.motion-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .28s ease;transform:scale(1.001);will-change:opacity}.portrait.visible,.motion-video.visible{opacity:1}.placeholder{position:absolute;inset:0;z-index:0;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#d8d1c4,#bfc8c2);color:white;font-size:14px}.placeholder[hidden]{display:none!important}.state{font-size:13px;color:var(--muted);letter-spacing:.12em}.caption{min-height:2.7em;max-width:620px;font-size:17px;line-height:1.6}.status.live{color:var(--ok)}.status.error{color:var(--err)}.continuity.ready{color:var(--ok);font-weight:600}.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:24px;padding:14px;display:grid;gap:12px}.buttons,.session-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.channel-button.active{border-color:rgba(52,91,70,.48);box-shadow:inset 0 0 0 1px rgba(52,91,70,.18);color:var(--ok)}.voice-choice{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.55);font-size:13px;color:var(--muted)}.voice-choice input{inline-size:18px;block-size:18px;accent-color:var(--ok)}button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--ink);border-radius:16px;padding:14px 12px;font:inherit;font-weight:600;touch-action:manipulation}button:disabled{opacity:.45}.budget-notice{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid rgba(138,100,40,.25);border-radius:16px;background:rgba(250,241,220,.8);color:var(--warn);font-size:13px;line-height:1.5}.budget-notice[data-severity="hard"]{border-color:rgba(154,62,54,.25);background:rgba(252,234,231,.82);color:var(--err)}.budget-notice[hidden]{display:none}.budget-notice p{margin:0}.budget-notice button{padding:8px 12px;font-size:12px}.conversation-panel{border-top:1px solid var(--line);padding-top:2px}.conversation-panel summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:8px 4px;font-size:14px;font-weight:650}.conversation-panel summary::-webkit-details-marker{display:none}.conversation-panel summary::after{content:'＋';color:var(--muted);font-weight:400}.conversation-panel[open] summary::after{content:'−'}.unread{min-width:18px;padding:2px 6px;margin-left:auto;margin-right:10px;border-radius:999px;background:var(--hiro);color:white;font-size:11px;text-align:center}.unread[hidden]{display:none}.transcript{display:flex;flex-direction:column;gap:10px;max-height:min(42svh,360px);overflow:auto;padding:8px 2px 12px;scroll-behavior:smooth}.transcript-empty{margin:18px 8px;color:var(--muted);font-size:14px;text-align:center}.turn{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.turn.agent{align-self:flex-start;background:var(--nagi);border-bottom-left-radius:6px}.turn.user{align-self:flex-end;background:var(--hiro);color:white;border-bottom-right-radius:6px}.turn-meta{display:block;margin-top:4px;font-size:11px;line-height:1.2;opacity:.62}.turn.revealing::after{content:'';display:inline-block;width:.42em;height:1em;margin-left:3px;vertical-align:-.12em;background:currentColor;opacity:.45;animation:blink .9s steps(2,end) infinite}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.composer textarea{width:100%;min-height:48px;max-height:128px;resize:none;border:1px solid var(--line);border-radius:16px;padding:12px 13px;background:rgba(255,255,255,.94);color:var(--ink);font:inherit;font-size:16px;line-height:1.45}.composer textarea:focus{outline:2px solid rgba(52,91,70,.22);border-color:rgba(52,91,70,.45)}.composer button{min-height:48px;padding:12px 18px}.diagnostics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.diagnostics button{padding:9px 10px;font-size:12px;font-weight:550}.debug{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.45;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:96px;overflow:auto;border-top:1px solid var(--line);padding-top:9px}.hint{text-align:center;line-height:1.55}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes blink{50%{opacity:0}}@media(max-width:520px){.app{padding-left:14px;padding-right:14px}.portrait-wrap{width:min(84vw,390px);border-radius:28px}.caption{font-size:16px}.session-actions{grid-template-columns:1fr}.turn{max-width:91%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.portrait,.motion-video{transition:none}.turn.revealing::after{animation:none}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="brand">Nagi Presence Client</div><div class="sub">Milestone 3C / Voice + Chat</div></div><div class="ver">v1.1.0</div></header>
<section class="stage">
<div class="portrait-wrap"><div id="placeholder" class="placeholder">凪さんを読み込み中です。</div><img id="portraitA" class="portrait visible" alt="凪さん"><img id="portraitB" class="portrait" alt="凪さん"><video id="motionVideo" class="motion-video" muted playsinline loop preload="auto" aria-label="凪さん interaction motion"></video></div>
<div id="state" class="state">NEUTRAL</div><div id="caption" class="caption">話したくなったら、会話を始めてください。</div><div id="status" class="status">voice: disconnected</div><div id="continuity" class="continuity">conversation: new</div>
</section>
<section class="panel">
<div class="buttons"><button id="startVoice" class="channel-button">🎙 声で話す</button><button id="startText" class="channel-button">⌨️ 文字で話す</button></div>
<div class="session-actions"><label class="voice-choice"><input id="replyWithVoice" type="checkbox">文字入力への返事も音声で</label><button id="stop" disabled>会話を一旦終了</button></div>
<div id="budgetNotice" class="budget-notice" role="status" aria-live="polite" hidden><p id="budgetMessage"></p><button id="budgetDismiss" type="button">確認</button></div>
<details id="conversationPanel" class="conversation-panel"><summary>会話<span id="unread" class="unread" hidden>0</span></summary><div id="transcript" class="transcript" role="log" aria-label="凪さんとの会話"><p id="transcriptEmpty" class="transcript-empty">ここに会話が残ります。</p></div><form id="composer" class="composer"><label class="sr-only" for="textInput">凪さんへのメッセージ</label><textarea id="textInput" rows="1" maxlength="2000" placeholder="凪さんに文字で話す"></textarea><button id="sendText" type="submit">送る</button></form></details>
<div class="diagnostics"><button id="inspectLog">診断ログを表示</button><button id="exportLog">JSONLを保存</button></div><div id="debug" class="debug">ready</div><div class="hint">声と文字は同じ会話として保存されます。文字だけで始めたとき、返事の音声は自動では流れません。</div>
</section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
