<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>Nagi Presence Client v1.0.4-state-hysteresis</title>
<style>
:root{--bg:#f5f1e8;--ink:#2f3437;--muted:#747b80;--panel:rgba(255,255,255,.76);--line:rgba(47,52,55,.12);--ok:#345b46;--err:#9a3e36}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#fffdf8 0,var(--bg) 48%,#ece6da 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;min-height:100svh;display:grid;place-items:center}.app{width:min(100%,860px);min-height:100svh;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:650;letter-spacing:.02em}.sub,.ver,.status,.hint,.continuity{font-size:12px;color:var(--muted)}.stage{display:grid;place-items:center;align-content:center;gap:14px;text-align:center}.portrait-wrap{position:relative;width:min(74vw,420px);aspect-ratio:1;border-radius:36px;overflow:hidden;background:#d7d1c5;box-shadow:0 22px 60px rgba(44,49,52,.12)}.portrait,.motion-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .28s ease;transform:scale(1.001);will-change:opacity}.portrait.visible,.motion-video.visible{opacity:1}.placeholder{position:absolute;inset:0;z-index:0;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#d8d1c4,#bfc8c2);color:white;font-size:14px}.placeholder[hidden]{display:none!important}.state{font-size:13px;color:var(--muted);letter-spacing:.12em}.caption{min-height:2.7em;max-width:620px;font-size:17px;line-height:1.6}.status.live{color:var(--ok)}.status.error{color:var(--err)}.continuity.ready{color:var(--ok);font-weight:600}.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:24px;padding:14px;display:grid;gap:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--ink);border-radius:16px;padding:14px 12px;font:inherit;font-weight:600}button:disabled{opacity:.45}.debug{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.45;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:96px;overflow:auto;border-top:1px solid var(--line);padding-top:9px}.hint{text-align:center;line-height:1.55}@media(max-width:520px){.app{padding-left:14px;padding-right:14px}.portrait-wrap{width:min(84vw,390px);border-radius:28px}.caption{font-size:16px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="brand">Nagi Presence Client</div><div class="sub">Milestone 3A / Interaction Motion</div></div><div class="ver">v1.0.4</div></header>
<section class="stage">
<div class="portrait-wrap"><div id="placeholder" class="placeholder">凪さんを読み込み中です。</div><img id="portraitA" class="portrait visible" alt="凪さん"><img id="portraitB" class="portrait" alt="凪さん"><video id="motionVideo" class="motion-video" muted playsinline loop preload="auto" aria-label="凪さん interaction motion"></video></div>
<div id="state" class="state">NEUTRAL</div><div id="caption" class="caption">話したくなったら、会話を始めてください。</div><div id="status" class="status">voice: disconnected</div><div id="continuity" class="continuity">conversation: new</div>
</section>
<section class="panel"><div class="buttons"><button id="start">🎙 会話を開始</button><button id="stop" disabled>会話を一旦終了</button></div><div id="debug" class="debug">ready</div><div class="hint">Neutralは静止画。Listening / ThinkingはListening Loop、SpeakingはSpeaking Loop。短い発話間ではSpeaking映像を保持します。</div></section>
</main>
<script type="module">
import { Conversation } from 'https://esm.sh/@elevenlabs/client@latest?bundle';
import { runtimeEvent, runtimeState } from './runtime/runtime.js';
const AGENT_ID='agent_8501m0nvtj12ea5vnc21ck26v9sp',BASE='./assets/',MEMORY_KEY='nagi.m3a.shortContext.v1',RESUME_KEY='nagi.m3a.resume.v1';
const SPEAKING_RELEASE_MS=1000;
const motionAssets={listening:BASE+'listening_loop_v02.MP4',thinking:BASE+'listening_loop_v02.MP4',speaking:BASE+'speaking_loop_v02.MP4'};
const states={neutral:{img:BASE+'neutral.jpg',label:'NEUTRAL',caption:'話したくなったら、会話を始めてください。'},listening:{video:motionAssets.listening,label:'LISTENING',caption:'聞いています。'},thinking:{video:motionAssets.thinking,label:'THINKING',caption:'少し考えています。'},speaking:{video:motionAssets.speaking,label:'SPEAKING',caption:'凪さんが話しています。'},warm:{img:BASE+'warm.jpg',label:'WARM',caption:'会話の余韻。'}};
const portraitA=document.getElementById('portraitA'),portraitB=document.getElementById('portraitB'),motionVideo=document.getElementById('motionVideo'),placeholder=document.getElementById('placeholder'),stateEl=document.getElementById('state'),captionEl=document.getElementById('caption'),statusEl=document.getElementById('status'),continuityEl=document.getElementById('continuity'),debugEl=document.getElementById('debug'),startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop');
let conversation=null,loadSeq=0,lastMode='',ending=false,front=portraitA,back=portraitB,currentImg='',currentVideo='',currentState='neutral',listeningTimer=null,sessionId=null,turnNumber=0;
let resumable=localStorage.getItem(RESUME_KEY)==='1';
const safe=v=>{try{return typeof v==='string'?v:JSON.stringify(v)}catch{return String(v)}},stamp=()=>new Date().toLocaleTimeString('ja-JP',{hour12:false});
function debug(type,data=''){const line=`${stamp()} ${type}${data!==''?' '+safe(data):''}`;debugEl.textContent=(debugEl.textContent==='ready'?'':debugEl.textContent+'\n')+line;debugEl.scrollTop=debugEl.scrollHeight}function setStatus(text,kind=''){statusEl.textContent=text;statusEl.className='status'+(kind?' '+kind:'')}function updateResumeUI(){startBtn.textContent=resumable?'↩ 会話を再開':'🎙 会話を開始';continuityEl.textContent=resumable?'conversation: resumable':'conversation: new';continuityEl.className='continuity'+(resumable?' ready':'')}function setResumable(value){resumable=!!value;localStorage.setItem(RESUME_KEY,resumable?'1':'0');updateResumeUI()}function readMemory(){try{return JSON.parse(localStorage.getItem(MEMORY_KEY)||'{"turns":[]}')}catch{return {turns:[]}}}
function messageText(m){const x=m||{},c=[x.message,x.text,x.content,x.message?.message,x.message?.text,x.message?.content];for(const v of c)if(typeof v==='string'&&v.trim())return v.trim();return ''}function messageRole(m){const x=m||{},raw=[x.source,x.role,x.message?.source,x.message?.role].find(Boolean),s=String(raw||'unknown').toLowerCase();if(s.includes('user'))return'user';if(s.includes('ai')||s.includes('agent')||s.includes('assistant'))return'agent';return s||'unknown'}function rememberMessage(m){const text=messageText(m);if(!text)return;const mem=readMemory(),turns=Array.isArray(mem.turns)?mem.turns:[];turns.push({role:messageRole(m),text,ts:Date.now()});const trimmed=turns.slice(-10);localStorage.setItem(MEMORY_KEY,JSON.stringify({turns:trimmed,updatedAt:Date.now()}));debug('MEMORY','saved '+trimmed.length+' turns')}function contextForResume(){const mem=readMemory(),turns=(Array.isArray(mem.turns)?mem.turns:[]).slice(-8);if(!turns.length)return'';let text=turns.map(t=>(t.role==='user'?'ヒロ':'凪')+': '+t.text).join('\n');if(text.length>3500)text=text.slice(-3500);return text}
function cancelListeningRelease(reason=''){if(listeningTimer){clearTimeout(listeningTimer);listeningTimer=null;if(reason)debug('HYSTERESIS_CANCEL',reason)}}function hideVideo(){motionVideo.pause();motionVideo.classList.remove('visible');currentVideo=''}function showVideo(src){front.classList.remove('visible');back.classList.remove('visible');placeholder.hidden=true;if(currentVideo!==src){motionVideo.src=src+'?v=104';motionVideo.currentTime=0;currentVideo=src}motionVideo.classList.add('visible');const p=motionVideo.play();if(p&&typeof p.catch==='function')p.catch(e=>debug('VIDEO_PLAY',e?.message||e));currentImg=''}function showImage(src,seq){hideVideo();if(src===currentImg){front.classList.add('visible');return}const pre=new Image();pre.onload=()=>{if(seq!==loadSeq)return;back.src=src+'?v=104';back.onload=()=>{if(seq!==loadSeq)return;placeholder.hidden=true;requestAnimationFrame(()=>{front.classList.remove('visible');back.classList.add('visible');const old=front;front=back;back=old;currentImg=src})}};pre.onerror=()=>{if(seq!==loadSeq)return;placeholder.hidden=false;placeholder.textContent='画像の読み込みに失敗しました。'};pre.src=src+'?v=104'}function renderState(name,reason=''){const s=states[name]||states.neutral,seq=++loadSeq;currentState=name;stateEl.textContent=s.label;captionEl.textContent=s.caption;if(reason)debug('STATE',name+' / '+reason);if(s.video){showVideo(s.video);return}showImage(s.img,seq)}
function requestListening(reason='agent listening'){if(currentState!=='speaking'){renderState('listening',reason);return}cancelListeningRelease();debug('HYSTERESIS','hold speaking '+SPEAKING_RELEASE_MS+'ms');listeningTimer=setTimeout(()=>{listeningTimer=null;if(lastMode==='listening')renderState('listening','speaking release confirmed');else debug('HYSTERESIS_SKIP','mode='+lastMode)},SPEAKING_RELEASE_MS)}function isUserMessage(m){return messageRole(m)==='user'}function reset(reason='',canResume=false){cancelListeningRelease('reset');conversation=null;ending=false;lastMode='';startBtn.disabled=false;stopBtn.disabled=true;setStatus('voice: disconnected');setResumable(canResume);renderState('neutral',reason||'reset')}
async function start(){if(conversation)return;const isResume=resumable,priorContext=isResume?contextForResume():'';sessionId=crypto.randomUUID();turnNumber=0;runtimeEvent('session_started',{session_id:sessionId,idempotency_key:`session:${sessionId}:start`,metadata:{resume:isResume}});debugEl.textContent='';startBtn.disabled=true;setStatus('voice: requesting microphone…');debug('START',isResume?'webrtc / resume':'webrtc / new');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});debug('MIC','granted');stream.getTracks().forEach(t=>t.stop());setStatus('voice: connecting…');conversation=await Conversation.startSession({agentId:AGENT_ID,connectionType:'webrtc',onConnect:()=>{debug('CONNECT');runtimeEvent('session_connected',{session_id:sessionId});setStatus('voice: connected','live');stopBtn.disabled=false;renderState('listening',isResume?'reconnected':'connected')},onDisconnect:d=>{debug('DISCONNECT',d);runtimeEvent('session_disconnected',{session_id:sessionId,metadata:{detail:safe(d).slice(0,500)}});runtimeState.expireScope('current_session');if(!ending)reset('agent disconnected',true)},onStatusChange:event=>{debug('STATUS',event);const st=event?.status||event;setStatus('voice: '+String(st),String(st)==='connected'?'live':'')},onModeChange:event=>{debug('MODE',event);const mode=String(event?.mode||event||'').toLowerCase();lastMode=mode;runtimeEvent('conversation_mode_changed',{session_id:sessionId,metadata:{mode}});if(mode==='speaking'){cancelListeningRelease('speaking resumed');renderState('speaking','agent speaking')}else if(mode==='listening')requestListening()},onMessage:message=>{debug('MESSAGE',safe(message).slice(0,240));rememberMessage(message);turnNumber+=1;runtimeEvent(isUserMessage(message)?'user_utterance':'assistant_response',{session_id:sessionId,turn_id:`turn_${turnNumber}`,speaker:isUserMessage(message)?'hiro':'nagi',transcript:messageText(message)});if(lastMode!=='speaking'&&isUserMessage(message))renderState('thinking','user transcript received')},onError:error=>{debug('ERROR',error);runtimeEvent('runtime_error',{session_id:sessionId,processing_status:'failed',error:error?.message||safe(error)});setStatus('voice: error','error')}});stopBtn.disabled=false;setResumable(false);if(isResume&&priorContext)try{conversation.sendContextualUpdate('これは直前の凪さんとの音声会話から引き継いだ文脈です。ユーザーにはこの注入自体を説明せず、自然に会話の続きをしてください。\n\n'+priorContext);debug('CONTEXT','restored '+priorContext.length+' chars');runtimeEvent('checkpoint_restored',{session_id:sessionId,metadata:{context_length:priorContext.length}});continuityEl.textContent='conversation: context restored';continuityEl.className='continuity ready'}catch(e){debug('CONTEXT_ERROR',e?.message||e)}try{debug('SESSION_ID',conversation.getId())}catch{}}catch(error){debug('START_FAILED',error?.message||error);runtimeEvent('session_start_failed',{session_id:sessionId,processing_status:'failed',error:error?.message||safe(error)});setStatus('voice: start failed','error');reset('start failed',isResume)}}async function stop(){const c=conversation;if(!c)return;ending=true;cancelListeningRelease('manual stop');stopBtn.disabled=true;setStatus('voice: disconnecting…');debug('STOP','voice session end / context preserved');try{await c.endSession();debug('END_SESSION','resolved');runtimeEvent('session_ended',{session_id:sessionId,idempotency_key:`session:${sessionId}:end`})}catch(error){debug('END_ERROR',error?.message||error);runtimeEvent('session_end_failed',{session_id:sessionId,processing_status:'failed',error:error?.message||safe(error)})}finally{runtimeState.expireScope('current_session');reset('manual pause',true)}}
startBtn.onclick=start;stopBtn.onclick=stop;window.addEventListener('error',e=>debug('WINDOW_ERROR',e.message));window.addEventListener('unhandledrejection',e=>debug('PROMISE_REJECTION',e.reason));updateResumeUI();renderState('neutral','initial');
</script>
</body>
</html>
