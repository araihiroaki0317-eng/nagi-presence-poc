<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sofia × 凪 Voice PoC</title><style>body{font-family:system-ui;margin:20px;background:#111;color:#eee}button{font-size:18px;padding:14px 20px}video{display:block;width:min(100%,480px);margin-top:18px;background:#000}pre{white-space:pre-wrap;background:#1d1d1d;padding:12px;border-radius:10px}</style></head><body><h1>Sofia × 凪 Voice</h1><p>凪のElevenLabs音声をbitHuman Essence 2へ渡す同期テスト。</p><button id="run">テスト生成</button><pre id="log">ready</pre><video id="video" controls playsinline></video><script>
const W='https://nagi-voice-transport.arai-hiroaki0317.workers.dev';
document.querySelector('#run').onclick=async function(){this.disabled=true;log.textContent='生成中…';try{const r=await fetch(W+'/bithuman-test-render',{method:'POST'});const x=await r.json();log.textContent=JSON.stringify(x,null,2);if(x.video_url){video.src=x.video_url;video.load();}}catch(e){log.textContent='ERROR: '+e.message}finally{this.disabled=false}};
</script></body></html>
