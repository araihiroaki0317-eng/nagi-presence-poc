<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sofia × 凪 Voice PoC</title><style>body{font-family:system-ui;margin:20px;background:#111;color:#eee}button{font-size:18px;padding:14px 20px}video{display:block;width:min(100%,480px);margin-top:18px;background:#000}pre{white-space:pre-wrap;background:#1d1d1d;padding:12px;border-radius:10px}</style></head><body><h1>Sofia × 凪 Voice</h1><p>凪のElevenLabs音声をbitHuman Essence 2へ渡す同期テスト。</p><p>生成はbitHumanのクレジットとElevenLabsの音声枠を使用します。</p><button id="run">テスト生成</button><pre id="log">ready</pre><video id="video" controls playsinline></video><script>
const W='https://nagi-voice-transport.arai-hiroaki0317.workers.dev';
const log=document.querySelector('#log');
const video=document.querySelector('#video');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
document.querySelector('#run').onclick=async function(){
  this.disabled=true;
  log.textContent='生成中…';
  try{
    const r=await fetch(W+'/bithuman-test-render',{method:'POST'});
    let x=await r.json();
    log.textContent=JSON.stringify(x,null,2);
    if(!r.ok || !x.ok) throw new Error(JSON.stringify(x.error || '生成に失敗しました'));
    const jobId=x.job_id;
    const deadline=Date.now()+10*60*1000;
    while(!x.video_url && jobId && x.status!=='failed'){
      if(Date.now()>deadline) throw new Error('生成が継続中です。job_id: '+jobId);
      await sleep(3000);
      const status=await fetch(W+'/bithuman-test-render-status/'+encodeURIComponent(jobId));
      const result=await status.json();
      if(!status.ok || !result.ok) throw new Error(JSON.stringify(result.error || result.result || '状態取得に失敗しました'));
      x=result.result;
      log.textContent=JSON.stringify(x,null,2);
    }
    if(x.status==='failed' || x.success===false) throw new Error(JSON.stringify(x.error || '生成に失敗しました'));
    if(!x.video_url) throw new Error('動画URLが返されませんでした');
    video.src=x.video_url;
    video.load();
  }catch(e){log.textContent+='\nERROR: '+e.message}
  finally{this.disabled=false}
};
</script></body></html>
