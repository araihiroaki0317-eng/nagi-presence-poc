<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>凪 — 会話接続テスト</title>
<style>body{margin:0;background:#101719;color:#ecf3f0;font-family:system-ui}main{max-width:600px;margin:auto;padding:20px}h1{font-size:22px}video{display:block;width:100%;max-height:56svh;aspect-ratio:9/16;object-fit:contain;background:#080d0e;border-radius:16px}.row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #647972}button{background:#c6ddd3;color:#14231e}button:disabled{opacity:.4}input{flex:1;min-width:100px}p{line-height:1.6}#status{color:#c6ddd3}#transcript{white-space:pre-wrap;line-height:1.7}details{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style>
</head><body><main><h1>凪 — 会話接続テスト</h1>
<video id="avatar" autoplay playsinline muted></video><audio id="avatarAudio" autoplay playsinline></audio>
<p id="status">接続設定を確認しています。</p>
<p>Sofiaの姿で、凪の記憶と声をつなぎます。開始後は利用枠を消費します。画面を開いている間は90秒で自動終了します。</p>
<div class="row"><button id="start" disabled>会話を開始</button><button id="mic" disabled>マイクをミュート</button><button id="stop" disabled>終了</button><button id="play" hidden>音声を再生</button></div>
<p>挨拶の後はそのまま話せます。12秒間発話がなければ「凪」と単独で呼びかけて再開します。呼びかけ待ち中も音声認識は動作します。周囲の人の声との識別や、返答中の割り込みには未対応です。</p>
<form id="composer" class="row"><input id="text" placeholder="文字でも話せます" maxlength="1000" disabled><button id="send" disabled>送信</button></form>
<div id="transcript" aria-live="polite"></div><details><summary>接続情報</summary><pre id="debug"></pre></details>
</main><script type="module" src="./bithuman-live.js"></script></body></html>
